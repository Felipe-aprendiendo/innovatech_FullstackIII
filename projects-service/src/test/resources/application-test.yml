spring:
  datasource:
    url: jdbc:h2:mem:projectsdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

logging:
  level:
    cl.innovatech.projects_service: DEBUG

app:
  services:
    users-url: http://localhost:8002
