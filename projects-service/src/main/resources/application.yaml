server:
  port: 8003

spring:
  application:
    name: projects-service

  datasource:
    url: jdbc:mysql://localhost:3308/innovatech_projects?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_PROJECTS_USER:root}
    password: ${DB_PROJECTS_PASS:innovatech2024}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  services:
    users-url: ${USERS_SERVICE_URL:http://localhost:8002}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: logs/projects-service.log
  level:
    cl.innovatech.projects_service: DEBUG
