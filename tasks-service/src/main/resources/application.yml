server:
  port: 8004

spring:
  application:
    name: tasks-service

  datasource:
    url: jdbc:mysql://localhost:3309/innovatech_tasks?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${MYSQL_ROOT_PASSWORD:innovatech2024}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis Streams — para publicar eventos desde outbox
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

resilience4j:
  retry:
    instances:
      projects-client:
        max-attempts: 3
        wait-duration: 500ms
      users-client:
        max-attempts: 3
        wait-duration: 500ms

app:
  services:
    projects-url: ${PROJECTS_SERVICE_URL:http://localhost:8003}
    users-url: ${USERS_SERVICE_URL:http://localhost:8002}

logging:
  file:
    name: logs/tasks-service.log
  level:
    cl.innovatech.tasks: DEBUG
