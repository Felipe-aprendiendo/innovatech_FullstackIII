server:
  port: 8001
  servlet:
    context-path: /api/v1

spring:
  application:
    name: auth-service

  # ── Base de datos PROPIA (mysql-auth :3306) ──────────────────────────────
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:innovatech_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:innovatech2024}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: AuthHikariPool
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis (blacklist de refresh tokens) ─────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

# ── JWT ──────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:innovatech-secret-key-2024-must-be-at-least-256-bits-long}
  access-token-expiration-ms: 900000        # 15 minutos
  refresh-token-expiration-ms: 604800000    # 7 días

# ── Users Service (Feign) ────────────────────────────────────────────────
users-service:
  url: ${USERS_SERVICE_URL:http://localhost:8002}

# ── Resilience4j ─────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      users-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 15s
        failureRateThreshold: 50
  retry:
    instances:
      users-service:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  timelimiter:
    instances:
      users-service:
        timeoutDuration: 5s

# ── Springdoc / Swagger UI ───────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  info:
    title: Auth Service API
    description: Microservicio de autenticación JWT — InnovaTech
    version: 1.0.0

# ── Actuator ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    cl.innovatech.auth: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
